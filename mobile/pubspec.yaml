name: ips_dlu
description: Ứng dụng định vị trong nhà - Thư viện Đại học Đà Lạt
publish_to: 'none'
version: 0.2.0

# Cần Dart >= 3.6 (Flutter >= 3.27) vì mã dùng Color.withValues().
# Nếu dùng Flutter cũ hơn, thay toàn bộ .withValues(alpha: x) thành .withOpacity(x).
environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Ghim cứng, không dùng ^: thư viện đang ở 0.30.x tức chưa 1.0 nên bản nhỏ
  # vẫn có thể đổi API. Đồ án cần tái lập được kết quả nên khoá đúng một bản.
  liquid_glass_widgets: 0.30.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Quét WiFi và xin quyền — phần đưa ứng dụng từ dữ liệu demo sang chạy thật.
  wifi_scan: ^0.5.0
  permission_handler: ^12.0.1
  http: ^1.2.2

  # Nhớ địa chỉ máy chủ giữa hai lần mở app.
  shared_preferences: ^2.3.2
  flutter_compass: ^0.8.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Inter tĩnh 4 độ đậm, tạo từ bản biến thiên của app-compose (opsz 14) rồi cắt
  # còn Latin + tiếng Việt. Không dùng bản biến thiên: Flutter không tự ánh xạ
  # FontWeight sang trục wght, mọi chữ sẽ ra cùng một độ đậm.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # Bật sinh mã đa ngôn ngữ từ lib/l10n/*.arb theo cấu hình l10n.yaml
  generate: true

  assets:
    # Sơ đồ tầng 1 và nhãn nổi; sinh bằng tools/ve_so_do_tang1.py --app từ data/reference/mat_bang_tang1.yaml.
    - assets/map/so_do_tang1.svg
    - assets/map/so_do_tang1_toi.svg
    - assets/map/nhan_tang1.json

    # kNN k động cho tuỳ chọn "Mô hình cục bộ"; sinh bằng `python -m ml.xuat_mo_hinh`.
    - assets/model/k_dong.json

    # Ảnh thật của 12 khu vực: 11 thư mục đầu do nhóm CTK45 chụp, `wc/` do nhóm
    # 15 chụp ngày 07/09/2026. Đều thu về cạnh dài 1024 px chất lượng 80 — thừa
    # nét cho màn điện thoại mà không phình kho mã. Xem assets/images/NGUON.md.
    # Flutter không nhận mẫu lồng nhau nên phải liệt kê từng thư mục.
    - assets/images/ban_cong/
    - assets/images/ban_thu_thu/
    - assets/images/can_tin/
    - assets/images/cau_thang/
    - assets/images/cau_thang_tang_2_phai/
    - assets/images/cau_thang_tang_2_trai/
    - assets/images/cua_chinh/
    - assets/images/hanh_lang/
    - assets/images/hoi_truong_thu_vien/
    - assets/images/khu_vuc_doc/
    - assets/images/khu_vuc_tu_hoc/
    - assets/images/loi_ra/
    - assets/images/phong_tap_chi/
    - assets/images/tv3_4/
    - assets/images/wc_phai/
    - assets/images/wc_trai/
