name: ips_dlu
description: Ứng dụng định vị trong nhà - Thư viện Đại học Đà Lạt (bản demo giao diện)
publish_to: 'none'
version: 0.1.0

# Cần Dart >= 3.6 (Flutter >= 3.27) vì mã dùng Color.withValues().
# Nếu dùng Flutter cũ hơn, thay toàn bộ .withValues(alpha: x) thành .withOpacity(x).
environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Ghim cứng, không dùng ^: thư viện đang ở 0.30.x tức chưa 1.0 nên bản nhỏ
  # vẫn có thể đổi API. Đồ án cần tái lập được kết quả nên khoá đúng một bản.
  liquid_glass_widgets: 0.30.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bật sinh mã đa ngôn ngữ từ lib/l10n/*.arb theo cấu hình l10n.yaml
  generate: true
