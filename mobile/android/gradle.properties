org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Tắt biên dịch tăng dần của Kotlin.
#
# Ứng dụng dùng Kotlin Gradle Plugin 2.4.0, còn plugin wifi_scan 0.4.1+2 khai
# Kotlin 1.8.21 với jvmTarget 1.8. Cơ chế tăng dần của Kotlin 2.x không xử lý
# được cấu hình cũ đó và làm hỏng build với lỗi
# "Could not close incremental caches ... Storage is already registered" —
# xảy ra cả khi build sạch hoàn toàn và đã tắt hết daemon.
#
# Đổi lại build lâu hơn vài chục giây. Gỡ dòng này khi nâng được wifi_scan lên
# bản dùng KGP 2.x.
kotlin.incremental=false
